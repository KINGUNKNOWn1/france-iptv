<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, meta description, canonical, hreflang, and Open Graph/Twitter
         tags are intentionally NOT hardcoded here. Every route (including "/")
         sets these itself via the <SEO> component (react-helmet-async), so
         each page gets its own correct values instead of every route
         duplicating this file's static tags alongside the real ones. -->

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- DNS Prefetch & Preconnect for performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://analytics-backend-ten.vercel.app" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <!-- Optimized font loading with display=swap for faster rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>

    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C3J7FTQLFE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C3J7FTQLFE');
    </script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1123048390387673');
    fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Structured Data: Organization is valid on every page (describes the
         publisher, not page-specific content), so it's safe to ship
         statically here. Product/FAQPage schemas are homepage-specific
         (they must match visible content) and are added via <SEO> only on
         the homepage instead. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "France IPTV",
      "url": "https://franceiptv.stream",
      "logo": "https://franceiptv.stream/logo.svg",
      "description": "France IPTV : abonnement IPTV en France avec 30 500+ chaînes, films et séries en HD/4K et support francophone.",
      "address": { "@type": "PostalAddress", "addressCountry": "FR" },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["French", "Arabic", "Turkish", "English"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "France IPTV",
      "url": "https://franceiptv.stream",
      "inLanguage": "fr-FR",
      "publisher": { "@type": "Organization", "name": "France IPTV", "url": "https://franceiptv.stream" }
    }
    </script>
  </head>
  <body>
    <!-- Meta Pixel no-JS fallback: must live in <body>; an <img> in <head> ends the head early. -->
    <noscript><img height="1" width="1" alt="" style="display:none"
    src="https://www.facebook.com/tr?id=1123048390387673&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Analytics Tracking -->
    <script src="https://analytics-backend-ten.vercel.app/tracker.js" defer></script>
  </body>
</html>
